<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mawzun</title>
    <script>
      // Smart redirect for the app root: signed-in → dashboard, else → login.
      // Static file served by Workers Assets — the SSR worker is never in the
      // path for "/", so a cold isolate can never break the first load.
      (function () {
        var t = null;
        try { t = localStorage.getItem("mawzun.accessToken"); } catch (e) {}
        // Match SessionGate semantics: any token present → try dashboard;
        // SessionGate will bounce to /login if the pair turns out dead.
        var target = t ? "/dashboard/sales-overview" : "/login";
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0">
    <p>جارٍ التحويل…</p>
  </body>
</html>

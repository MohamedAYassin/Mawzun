name: cleanup_worker

# Path-filtered so a change to this Worker does not rebuild the other eight
# services. See api.yml for the reasoning.
on:
  push:
    branches: [main]
    paths:
      - "cleanup_worker/**"
      - ".github/workflows/cleanup_worker.yml"
  pull_request:
    paths:
      - "cleanup_worker/**"
      - ".github/workflows/cleanup_worker.yml"
  workflow_dispatch:

concurrency:
  group: cleanup_worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # `wrangler` needs a local Postgres URL to emulate the Hyperdrive binding
      # at build time. It reads this from the PROCESS ENVIRONMENT, not from
      # .dev.vars — a trap worth knowing. The value is never used: a dry run
      # does not connect.
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://ci:ci@127.0.0.1:5432/ci

    defaults:
      run:
        working-directory: cleanup_worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Required in a monorepo: the default looks for the lockfile at the
          # repository root and would never hit the cache.
          cache: npm
          cache-dependency-path: cleanup_worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `wrangler deploy --dry-run` bundles the Worker exactly as a deploy
      # would, without publishing. It catches a broken import or a bad binding
      # that a typecheck alone would miss.
      - name: Build (wrangler dry run)
        run: npm run build

      # verify-sweeps.mjs needs a live database and the Backend's .env, neither
      # of which exist in this repository, so the boundary assertions run
      # locally rather than here. What CI can prove is that the module graph
      # compiles and the Worker bundles — which the steps above do.
